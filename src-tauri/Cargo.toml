[package]
name = "mtga-hub"
version = "0.1.3"
description = "MTGA collection and economy tracker"
authors = ["Ryan"]
edition = "2021"
default-run = "mtga-hub"

[lib]
name = "mtga_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
log = "0.4"
env_logger = "0.11"
notify = "7"
tauri-plugin-http = "2.5.9"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["sync", "fs", "net"] }
axum = "0.7"
flate2 = "1"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
]
